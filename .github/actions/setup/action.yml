name: Set up workspace
description: >-
  pnpm (version from package.json#packageManager) and Node.js (.nvmrc) with the pnpm store cached,
  followed by a frozen-lockfile install.

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile`.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # No `version` input: the action reads package.json#packageManager (pnpm@12.x).
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # pnpm 12 only runs install scripts allow-listed under `allowBuilds` in pnpm-workspace.yaml.
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
