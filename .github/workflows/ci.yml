name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR / ref. Superseded PR runs are cancelled; runs on main always finish because each one
# publishes images.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # CI uses Redis service containers; skip redis-memory-server's download/compile on install.
  REDISMS_DISABLE_POSTINSTALL: true
  FORCE_COLOR: 1

jobs:
  quality:
    name: Format, lint, typecheck & unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ runner.os }}-

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Module registries are in sync
        run: pnpm modules:check
      - name: Generated extension point reference is up to date
        run: pnpm docs:check
      - run: pnpm test

  helm:
    name: Helm chart (lint & render)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint and render the chart-secret, external-secret and sandbox/S3 variants
        working-directory: infra/helm/isbp
        run: |
          set -euo pipefail
          # values.yaml has no usable secrets or URL on purpose: render with the CI values files.
          helm lint . -f ci/create-values.yaml
          helm lint . -f ci/external-values.yaml
          helm template ci . -f ci/external-values.yaml > /dev/null
          helm template ci . -f ci/create-values.yaml --set sandbox.runner=kubernetes \
            --set networkPolicy.enabled=true --set files.storage=s3 --set files.s3.bucket=ci > rendered.yaml
          grep -q 'name: isbp-sandbox-deny-all' rendered.yaml
          grep -q 'SANDBOX_RUNNER: kubernetes' rendered.yaml

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: isbp
          POSTGRES_PASSWORD: isbp
          POSTGRES_DB: isbp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U isbp -d isbp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: pnpm test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://isbp:isbp@localhost:5432/isbp_test
          REDIS_URL: redis://localhost:6379

  drivers:
    name: Database drivers & sandbox (SQL Server, Oracle, MySQL, PostgreSQL, Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The same driver suite against every engine, plus the Docker script runner. Locally these run only
    # for the engines whose ISBP_TEST_*_URL is set.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: isbp
          POSTGRES_PASSWORD: isbp
          POSTGRES_DB: isbp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U isbp -d isbp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Isbp-Ci-2026!
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: isbp
          MYSQL_DATABASE: isbp_drv
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pisbp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: isbp
          APP_USER: isbp
          APP_USER_PASSWORD: isbp
        ports: ['1521:1521']
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Driver suite
        run: pnpm --filter @isbp/sql test:drivers
        env:
          ISBP_TEST_PG_URL: postgres://isbp:isbp@localhost:5432/isbp_test
          ISBP_TEST_MSSQL_URL: mssql://sa:Isbp-Ci-2026!@localhost:1433/master
          ISBP_TEST_MYSQL_URL: mysql://root:isbp@127.0.0.1:3306/isbp_drv
          ISBP_TEST_ORACLE_URL: oracle://isbp:isbp@localhost:1521/FREEPDB1

      - name: Docker script runner
        run: pnpm --filter @isbp/api exec vitest run --project unit test/unit/sandbox-docker.test.ts
        env:
          ISBP_TEST_DOCKER: '1'

  e2e:
    name: End-to-end (Playwright ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One stack per shard: the suite outgrew a single 30-minute job.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: isbp
          POSTGRES_PASSWORD: isbp
          POSTGRES_DB: isbp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U isbp -d isbp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    # Runtime configuration for the API/worker/web processes. NODE_ENV=production is set on the steps
    # that run them (not job-wide, so `pnpm install` still installs devDependencies).
    env:
      DATABASE_URL: postgres://isbp:isbp@localhost:5432/isbp
      REDIS_URL: redis://localhost:6379
      PUBLIC_URL: http://localhost:3000
      API_INTERNAL_URL: http://127.0.0.1:4000
      LOG_LEVEL: info
      SEED_ADMIN_PASSWORD: ChangeMe-2026!
      E2E_BASE_URL: http://localhost:3000
      # Production builds default attachments to /var/lib/isbp/files, which the runner can't create.
      FILES_DIR: /tmp/isbp-files
      # The stack calls itself on localhost (scheduled HTTP jobs, the seeded health check); production
      # blocks private targets by default.
      ISBP_ALLOW_PRIVATE_WEBHOOKS: 'true'
      # Stand-ins for ServiceDesk Plus and Azure DevOps Server (on-premises): the seed connects the demo
      # integrations to them.
      INTEGRATION_MOCKS_URL: http://localhost:4100
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Start the integration mocks
        run: |
          logs="$RUNNER_TEMP/logs" && mkdir -p "$logs"
          (DEV_MOCKS_PORT=4100 MOCKS_DATA_FILE="$RUNNER_TEMP/integration-mocks.json" \
            nohup pnpm --filter @isbp/integration-mocks start > "$logs/mocks.log" 2>&1 &)
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:4100/_mock/health >/dev/null; do sleep 1; done'

      - name: Build API and web
        run: pnpm turbo run build --filter=@isbp/api --filter=@isbp/web

      # Same layout as the web image: the standalone server only serves these when they sit next to it.
      - name: Assemble Next.js standalone output
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public

      - name: Generate a throwaway master key
        run: |
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "ISBP_MASTER_KEY=$key" >> "$GITHUB_ENV"

      - name: Migrate and seed demo data
        env:
          NODE_ENV: production
        run: node apps/api/dist/migrate.js && node apps/api/dist/seed.js

      - name: Start API, worker and web
        env:
          NODE_ENV: production
        run: |
          logs="$RUNNER_TEMP/logs" && mkdir -p "$logs"
          (cd apps/api && nohup node --import ./dist/telemetry.js dist/main.js > "$logs/api.log" 2>&1 &)
          (cd apps/api && METRICS_PORT=9465 OTEL_SERVICE_NAME=isbp-worker \
            nohup node --import ./dist/telemetry.js dist/worker.js > "$logs/worker.log" 2>&1 &)
          (PORT=3000 HOSTNAME=0.0.0.0 nohup node apps/web/.next/standalone/apps/web/server.js > "$logs/web.log" 2>&1 &)
          timeout 120 bash -c 'until curl -fsS http://127.0.0.1:4000/readyz >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -fsS http://127.0.0.1:9465/readyz >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:3000/healthz >/dev/null; do sleep 2; done'
          echo "API, worker and web are up"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright (Chromium + system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @isbp/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @isbp/e2e exec playwright install-deps chromium

      # The assistant spec switches the platform's AI model (a global setting), so it runs after the last
      # shard's tests on that shard's stack (locally the `chat-model` project depends on the whole suite).
      - name: Run Playwright
        run: |
          pnpm --filter @isbp/e2e exec playwright test --project=chromium --shard=${{ matrix.shard }}/3
          if [ "${{ matrix.shard }}" = 3 ]; then
            pnpm --filter @isbp/e2e exec playwright test --project=chat-model --no-deps
          fi

      - name: Upload Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/logs
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker image (isbp-${{ matrix.component }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    # Smoke-test dependencies for the API image (reached from containers via --network host).
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: isbp
          POSTGRES_PASSWORD: isbp
          POSTGRES_DB: isbp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U isbp -d isbp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      LOCAL_TAG: isbp-${{ matrix.component }}:ci
    steps:
      - uses: actions/checkout@v7

      # GHCR repository names must be lowercase.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/isbp-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=isbp-${{ matrix.component }}

      - name: Build (load for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.LOCAL_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=isbp-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=isbp-${{ matrix.component }}

      - name: Smoke test isbp-api (migrate, API, worker)
        if: matrix.component == 'api'
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id "$LOCAL_TAG" -u)" = 10001
          key="$(openssl rand -base64 32)"
          run=(docker run --network host --read-only --tmpfs /tmp
            -e DATABASE_URL=postgres://isbp:isbp@localhost:5432/isbp -e REDIS_URL=redis://localhost:6379
            -e ISBP_MASTER_KEY="$key" -e PUBLIC_URL=http://localhost:3000)
          "${run[@]}" --rm "$LOCAL_TAG" node dist/migrate.js
          "${run[@]}" -d --name api "$LOCAL_TAG"
          "${run[@]}" -d --name worker -e METRICS_PORT=9465 "$LOCAL_TAG" node --import ./dist/telemetry.js dist/worker.js
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:4000/readyz; do sleep 2; done'
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:9465/readyz; do sleep 2; done'
          metrics="$(curl -fsS http://127.0.0.1:9464/metrics)"
          grep -q '^isbp_' <<<"$metrics"

      - name: Smoke test isbp-web
        if: matrix.component == 'web'
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id "$LOCAL_TAG" -u)" = 10001
          docker run -d --name web --read-only --tmpfs /tmp --tmpfs /app/apps/web/.next/cache \
            -p 3000:3000 -e API_INTERNAL_URL=http://127.0.0.1:4000 "$LOCAL_TAG"
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:3000/healthz; do sleep 2; done'
          curl -fsS -o /dev/null http://127.0.0.1:3000/icon.svg

      - name: Container logs
        if: failure()
        run: for c in api worker web; do docker logs "$c" 2>&1 | tail -n 200 || true; done

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fully cached by the build above; only runs for pushes to main.
      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=isbp-${{ matrix.component }}
