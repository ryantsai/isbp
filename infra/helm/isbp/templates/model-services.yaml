{{- /*
  Optional AI model services (values `modelServices`): one Deployment, Service and (optionally) PVC each.
  Third-party images with their own users: they get the container hardening (no privilege escalation, no
  capabilities, RuntimeDefault seccomp) but not the platform's fixed UID or read-only root filesystem.
*/}}
{{- $ms := .Values.modelServices }}
{{- $enabled := list }}
{{- range $name := list "docling" "embeddings" "reranker" "ollama" "vllm" }}
{{- $s := index $ms $name }}
{{- if $s.enabled }}
{{- $enabled = append $enabled $name }}
{{- $ctx := dict "root" $ "component" $name }}
{{- $image := ternary $s.gpuImage $s.image (eq $s.gpu true) }}
{{- $persist := and $s.persistence $s.persistence.enabled }}
{{- if $persist }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "isbp.componentName" $ctx }}
  labels:
    {{- include "isbp.componentLabels" $ctx | nindent 4 }}
spec:
  accessModes: ['ReadWriteOnce']
  {{- with $s.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $s.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isbp.componentName" $ctx }}
  labels:
    {{- include "isbp.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  # One pod owns the weights volume (ReadWriteOnce).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "isbp.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isbp.componentLabels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $s.gpu $ms.gpu.runtimeClassName }}
      runtimeClassName: {{ $ms.gpu.runtimeClassName }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with $s.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (eq $name "ollama") $s.pull $persist }}
      initContainers:
        # Pulls the listed models into the volume once (a model already there is skipped), then stops.
        - name: pull
          image: {{ include "isbp.image" (dict "root" $ "image" $image) | quote }}
          imagePullPolicy: {{ include "isbp.imagePullPolicy" (dict "root" $ "image" $image) }}
          command: ['/bin/sh', '-c']
          args:
            - |
              ollama serve & server=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              for m in {{ join " " $s.pull }}; do
                ollama show "$m" >/dev/null 2>&1 || ollama pull "$m" || exit 1
              done
              kill $server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: weights
              mountPath: {{ $s.persistence.mountPath }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "isbp.image" (dict "root" $ "image" $image) | quote }}
          imagePullPolicy: {{ include "isbp.imagePullPolicy" (dict "root" $ "image" $image) }}
          {{- with $s.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $s.port }}
              protocol: TCP
          {{- if or $s.env $s.extraEnv }}
          env:
            {{- range $k, $v := $s.env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
            {{- with $s.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          # Weights load (or download, the first time) before the port opens: up to 30 minutes.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ['ALL']
          resources:
            {{- $resources := deepCopy ($s.resources | default dict) }}
            {{- if $s.gpu }}
            {{- $limits := merge (dict $ms.gpu.resource 1) ($resources.limits | default dict) }}
            {{- $_ := set $resources "limits" $limits }}
            {{- end }}
            {{- toYaml $resources | nindent 12 }}
          {{- if or $persist $s.shmSize }}
          volumeMounts:
            {{- if $persist }}
            - name: weights
              mountPath: {{ $s.persistence.mountPath }}
            {{- end }}
            {{- if $s.shmSize }}
            - name: shm
              mountPath: /dev/shm
            {{- end }}
          {{- end }}
      {{- if or $persist $s.shmSize }}
      volumes:
        {{- if $persist }}
        - name: weights
          persistentVolumeClaim:
            claimName: {{ include "isbp.componentName" $ctx }}
        {{- end }}
        {{- if $s.shmSize }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $s.shmSize }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "isbp.componentName" $ctx }}
  labels:
    {{- include "isbp.componentLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "isbp.componentSelectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $s.port }}
      targetPort: http
      protocol: TCP
---
{{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled $enabled }}
# Model services take requests from the api and worker pods only.
{{- range $name := $enabled }}
{{- $ctx := dict "root" $ "component" $name }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "isbp.componentName" $ctx }}
  labels:
    {{- include "isbp.componentLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "isbp.componentSelectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "isbp.componentSelectorLabels" (dict "root" $ "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "isbp.componentSelectorLabels" (dict "root" $ "component" "worker") | nindent 14 }}
---
{{- end }}
{{- end }}
