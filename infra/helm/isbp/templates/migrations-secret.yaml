{{- /*
Hook-scoped secret for the migrations Job. pre-install/pre-upgrade hooks run BEFORE the release's regular
resources are created or updated, so the Job cannot rely on the main Secret/ExternalSecret (missing on first
install, stale on upgrade). This copy is created just before the Job (lower hook weight) and deleted once the
hooks succeed. With secrets.mode=existing the Job reads the existing Secret directly.
*/}}
{{- if .Values.migrations.enabled }}
{{- $ctx := dict "root" . "component" "migrate" }}
{{- if eq .Values.secrets.mode "create" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isbp.migrationSecretName" . }}
  labels:
    {{- include "isbp.componentLabels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
data:
  {{- include "isbp.secretData" . | nindent 2 }}
{{- else if eq .Values.secrets.mode "external" }}
# The Job's pod waits (CreateContainerConfigError, retried by the kubelet) until ESO has synced the Secret.
apiVersion: {{ .Values.secrets.external.apiVersion | default "external-secrets.io/v1" }}
kind: ExternalSecret
metadata:
  name: {{ include "isbp.migrationSecretName" . }}
  labels:
    {{- include "isbp.componentLabels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- include "isbp.externalSecretSpec" (dict "root" . "target" (include "isbp.migrationSecretName" .)) | nindent 2 }}
{{- end }}
{{- end }}
