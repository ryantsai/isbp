{{- if eq .Values.secrets.mode "external" }}
apiVersion: {{ .Values.secrets.external.apiVersion | default "external-secrets.io/v1" }}
kind: ExternalSecret
metadata:
  name: {{ include "isbp.fullname" . }}
  labels:
    {{- include "isbp.labels" . | nindent 4 }}
spec:
  {{- include "isbp.externalSecretSpec" (dict "root" . "target" (include "isbp.secretName" .)) | nindent 2 }}
{{- end }}
