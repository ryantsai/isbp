{{- if eq .Values.secrets.mode "create" }}
# DEV/TEST ONLY — values come from secrets.values and are stored in the Helm release history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isbp.secretName" . }}
  labels:
    {{- include "isbp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "isbp.secretData" . | nindent 2 }}
{{- else }}
{{- /* Validates secrets.mode / secrets.existingSecret even when the chart does not own the Secret. */}}
{{- $_ := include "isbp.secretName" . }}
{{- end }}
