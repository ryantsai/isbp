# Prometheus config for `docker compose --profile observability`.
# The API and the worker expose /metrics on their internal metrics server (:9464), which is never
# published outside the compose network. DNS service discovery picks up every replica
# (`docker compose up --scale worker=3`).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: isbp-api
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 9464
    relabel_configs:
      - target_label: component
        replacement: api

  - job_name: isbp-worker
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 9464
    relabel_configs:
      - target_label: component
        replacement: worker

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
