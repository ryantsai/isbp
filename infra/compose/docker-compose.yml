# IS Big Platform — full stack: Postgres (pgvector) · Redis · migrations · API · worker · web.
#
#   cd infra/compose
#   cp .env.example .env              # then set ISBP_MASTER_KEY=$(openssl rand -base64 32)
#   docker compose up -d --build      # → http://localhost:3000
#
# Profiles (combine freely):
#   --profile demo           runs the idempotent demo seed after migrations (admin / ChangeMe-2026! by default)
#   --profile observability  Jaeger UI http://localhost:16686 (set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
#                            in .env) and Prometheus http://localhost:9090 scraping api/worker :9464
#   --profile ai-documents   Docling: OCR, layout and tables for attachments (models inside the image)
#   --profile ai-search      Text Embeddings Inference: a multilingual embedding model and a reranker
#   --profile ai-local       Ollama: a local chat or image description model (pulls OLLAMA_PULL once)
#   AI model services run on CPU; add -f docker-compose.gpu.yml for NVIDIA GPUs (and --profile ai-vllm).
#   Nothing is pulled or downloaded until its profile is started. Connect them in Administration → AI.
#
# Only the web app is published (WEB_PORT); it proxies /api/* to the API. Postgres, Redis and the metrics
# ports stay on the internal network. See docs/deployment.md for details.

name: isbp

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Hardening mirrored from the Helm chart: read-only root FS, no capabilities, no privilege escalation.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# api, worker, migrate and seed all run the same image. Every service carries the build section so that any
# of them can be started on its own; BuildKit's layer cache makes the repeated builds no-ops.
x-api-image: &api-image
  image: ${ISBP_API_IMAGE:-isbp-api}:${ISBP_IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
    args:
      APP_VERSION: ${ISBP_IMAGE_TAG:-local}

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-isbp}:${POSTGRES_PASSWORD:-isbp}@postgres:5432/${POSTGRES_DB:-isbp}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  REDIS_URL: redis://redis:6379
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
  ISBP_MASTER_KEY: ${ISBP_MASTER_KEY:?ISBP_MASTER_KEY is not set. Copy .env.example to .env and set it to the output of openssl rand -base64 32}
  ISBP_MASTER_KEY_PREVIOUS: ${ISBP_MASTER_KEY_PREVIOUS:-}
  # Migrations run once in the `migrate` service; app processes never migrate on their own.
  AUTO_MIGRATE: 'false'
  API_DOCS: ${API_DOCS:-true}
  OAUTH_TOKEN_TTL_SECONDS: ${OAUTH_TOKEN_TTL_SECONDS:-3600}
  # Attachments: the `files` volume (default) or an S3-compatible bucket (FILES_STORAGE=s3 + S3_* in .env).
  FILES_STORAGE: ${FILES_STORAGE:-local}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  # ClamAV clamd host:port to scan uploads (empty = no scanning).
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  # Notification webhooks may only target public HTTPS hosts unless this is true (SSRF guard).
  ISBP_ALLOW_PRIVATE_WEBHOOKS: ${ISBP_ALLOW_PRIVATE_WEBHOOKS:-false}
  # Empty = tracing disabled. With --profile observability use http://jaeger:4318.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  # Script jobs: `none` (default) or `docker` with --profile sandbox (containers on this host's Docker,
  # reached through a socket proxy that only allows container and image calls).
  SANDBOX_RUNNER: ${SANDBOX_RUNNER:-none}
  SANDBOX_DOCKER_HOST: ${SANDBOX_DOCKER_HOST:-tcp://docker-proxy:2375}
  SANDBOX_IMAGES: ${SANDBOX_IMAGES:-python:3.14-alpine,node:24-alpine,mcr.microsoft.com/powershell:lts-alpine-3.20,alpine:3.24}

services:
  postgres:
    # PostgreSQL 18 with pgvector; the PG18 images keep data in /var/lib/postgresql (one subfolder per major).
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isbp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isbp}
      POSTGRES_DB: ${POSTGRES_DB:-isbp}
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    # AOF persistence keeps queued jobs across restarts; BullMQ requires the `noeviction` policy.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # One-shot: core + module migrations (advisory-locked, idempotent). Re-run on every upgrade.
  migrate:
    <<: [*api-image, *hardening]
    command: ['node', 'dist/migrate.js']
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: isbp-migrate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'
    healthcheck:
      disable: true
    logging: *logging

  # One-shot demo data (profile `demo`). Idempotent: does nothing once the admin account exists.
  seed:
    <<: [*api-image, *hardening]
    profiles: ['demo']
    command: ['node', 'dist/seed.js']
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: isbp-seed
      # Demo-only credentials — never use the seed on a real deployment.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe-2026!}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo-2026!pass}
    volumes:
      - files:/var/lib/isbp/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
    healthcheck:
      disable: true
    logging: *logging

  api:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: isbp-api
    volumes:
      - files:/var/lib/isbp/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/readyz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

  worker:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    command: ['node', '--import', './dist/telemetry.js', 'dist/worker.js']
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: isbp-worker
    volumes:
      - files:/var/lib/isbp/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Uses the image's HEALTHCHECK (internal metrics server :9464/healthz).
    logging: *logging

  web:
    <<: *hardening
    image: ${ISBP_WEB_IMAGE:-isbp-web}:${ISBP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP_VERSION: ${ISBP_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # ── observability profile ──────────────────────────────────────────────────────────────────────────
  # Jaeger v2 (an OpenTelemetry Collector distribution): OTLP gRPC :4317 / HTTP :4318, UI :16686,
  # in-memory storage (traces are lost on restart — fine for local troubleshooting).
  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.22.0}
    profiles: ['observability']
    restart: unless-stopped
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0
    expose:
      - '4317'
      - '4318'
    ports:
      - '127.0.0.1:${JAEGER_UI_PORT:-16686}:16686'
    logging: *logging

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.0}
    profiles: ['observability']
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    logging: *logging

  # --profile sandbox: lets the worker start script containers (SANDBOX_RUNNER=docker) without mounting the
  # Docker socket into it. The proxy exposes only container/image endpoints and stays on the internal network.
  # Script containers still run on this host's Docker daemon: prefer rootless Docker for this host.
  docker-proxy:
    profiles: [sandbox]
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 0
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    logging: *logging

  # ── AI model services (optional) ───────────────────────────────────────────────────────────────────
  # Internal network only; the API reaches them by service name. Connect each in Administration → AI after
  # starting it (the base URLs are below). CPU images here; docker-compose.gpu.yml swaps in GPU images.

  # --profile ai-documents → Searchable attachments → Docling, base URL http://docling:5001. The layout, table and
  # OCR models are inside the image (about 4.4 GB on CPU): nothing else is downloaded at start.
  docling:
    image: ${DOCLING_IMAGE:-quay.io/docling-project/docling-serve-cpu:v1.35.0}
    profiles: ['ai-documents']
    restart: unless-stopped
    environment:
      # Set it in .env and enter the same key in Administration → AI.
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:-}
    expose:
      - '5001'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # --profile ai-search → Embeddings: OpenAI-compatible, base URL http://embeddings/v1, model BAAI/bge-m3,
  # 1024 dimensions; Reranker: Text Embeddings Inference, base URL http://reranker. Both are multilingual (English,
  # Chinese, Japanese). The weights (about 2.3 GB each) are downloaded from Hugging Face into `tei-models` on first
  # start; for an air-gapped site copy them there and set HF_HUB_OFFLINE=1 (docs/deployment.md → Model services).
  embeddings:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}
    profiles: ['ai-search']
    restart: unless-stopped
    command: ['--model-id', '${EMBEDDINGS_MODEL:-BAAI/bge-m3}', '--port', '80']
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - tei-models:/data
    expose:
      - '80'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  reranker:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}
    profiles: ['ai-search']
    restart: unless-stopped
    command: ['--model-id', '${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}', '--port', '80']
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - tei-models:/data
    expose:
      - '80'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # --profile ai-local → a chat or image description model: OpenAI-compatible, base URL http://ollama:11434/v1.
  # `ollama-pull` downloads the models listed in OLLAMA_PULL (default qwen2.5vl:7b, about 6 GB, which describes
  # images and also chats) into the `ollama` volume, once; OLLAMA_PULL= (empty) downloads nothing.
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.0}
    profiles: ['ai-local']
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    expose:
      - '11434'
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 12
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  ollama-pull:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.0}
    profiles: ['ai-local']
    entrypoint: ['/bin/sh', '-c']
    # $$ defers expansion to the container's shell.
    command: ['for m in $${OLLAMA_PULL}; do ollama pull "$$m" || exit 1; done']
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_PULL: ${OLLAMA_PULL-qwen2.5vl:7b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  pgdata:
  redisdata:
  promdata:
  files:
  tei-models:
  ollama:
