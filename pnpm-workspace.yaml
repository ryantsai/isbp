packages:
  - apps/*
  - packages/*
  - modules/*
  - tooling/*
  - e2e

# Scripts still run when installs are out of date (e.g. right after deleting a module, `pnpm modules:sync`
# must be able to run to repair the workspace).
verifyDepsBeforeRun: warn

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  '@parcel/watcher': false
  '@swc/core': false
  embedded-postgres: true
  esbuild: true
  msgpackr-extract: true
  # Thin mode is pure JavaScript; the script only checks for Thick-mode binaries.
  oracledb: false
  protobufjs: true
  redis-memory-server: true
  sharp: true
  unrs-resolver: true

# Single source of truth for shared dependency versions (`"dep": "catalog:"`).
catalog:
  # language & tooling
  typescript: 6.0.3
  '@types/node': ^24.19.1
  tsx: ^4.23.15
  tsdown: ^0.23.0
  turbo: ^2.11.7
  prettier: ^3.9.9
  eslint: ^9.39.5
  '@eslint/js': ^9.39.0
  typescript-eslint: ^8.71.1
  globals: ^17.13.0
  vitest: ^5.0.3
  '@playwright/test': ^1.63.0
  # shared runtime
  zod: ^4.6.5
  drizzle-orm: ^0.45.3
  drizzle-kit: ^0.31.11
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  fastify: ^5.12.5
  fastify-plugin: ^6.0.0
  fastify-type-provider-zod: ^7.0.0
  uuid: ^14.0.2
  # web
  next: 16.3.8
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  next-intl: ^4.14.9
  motion: ^14.0.0
  '@tanstack/react-query': ^5.104.1
  '@tanstack/react-table': ^8.21.3
  lucide-react: ^1.52.0
  radix-ui: ^1.7.0
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  class-variance-authority: ^0.7.1
  react-hook-form: ^7.89.0
  '@hookform/resolvers': ^5.9.1
  sonner: ^2.0.8
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2

