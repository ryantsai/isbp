packages:
  - apps/*
  - packages/*
  - modules/*
  - tooling/*
  - e2e

# Scripts still run when installs are out of date (e.g. right after deleting a module, `pnpm modules:sync`
# must be able to run to repair the workspace).
verifyDepsBeforeRun: warn

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  # IBM Plex CJK fonts: the script only sends IBM usage telemetry.
  # Astryx: the postinstall only prints a setup hint.
  '@astryxdesign/cli': false
  '@astryxdesign/core': false
  '@ibm/plex-sans-jp': false
  '@ibm/plex-sans-tc': false
  '@parcel/watcher': false
  '@swc/core': false
  embedded-postgres: true
  esbuild: true
  msgpackr-extract: true
  # Thin mode is pure JavaScript; the script only checks for Thick-mode binaries.
  oracledb: false
  protobufjs: true
  redis-memory-server: true
  sharp: true
  unrs-resolver: true

# Single source of truth for shared dependency versions (`"dep": "catalog:"`).
catalog:
  # language & tooling
  # TypeScript 7 (the native compiler) and ESLint 10 are out, but typescript-eslint supports TypeScript < 6.1 and
  # eslint-config-next's React, import and jsx-a11y plugins ESLint ≤ 9: these are the newest the toolchain accepts.
  # @types/node follows the runtime (Node 24 LTS).
  typescript: 6.0.3
  '@types/node': ^24.19.1
  tsx: ^4.23.15
  tsdown: ^0.23.0
  turbo: ^2.11.7
  prettier: ^3.9.9
  eslint: ^9.39.5
  '@eslint/js': ^9.39.5
  typescript-eslint: ^8.71.1
  globals: ^17.13.0
  vitest: ^5.0.3
  '@playwright/test': ^1.63.0
  # shared runtime
  zod: ^4.6.5
  drizzle-orm: ^0.45.3
  drizzle-kit: ^0.31.11
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  fastify: ^5.12.5
  fastify-plugin: ^6.0.0
  fastify-type-provider-zod: ^7.0.0
  uuid: ^14.0.2
  # web
  next: 16.4.0
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  next-intl: ^4.14.9
  motion: ^14.0.0
  '@tanstack/react-query': ^5.104.1
  '@tanstack/react-table': ^9.2.6
  lucide-react: ^1.52.0
  # Astryx design system (Meta): components, the neutral base theme our TEL theme extends, StyleX peer, CLI (docs + theme build)
  '@astryxdesign/core': ^0.6.7
  '@astryxdesign/theme-neutral': ^0.6.7
  '@astryxdesign/cli': ^0.6.7
  '@stylexjs/stylex': ^0.19.1
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  react-hook-form: ^7.89.0
  '@hookform/resolvers': ^5.9.1
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2

minimumReleaseAgeExclude:
  - '@scalar/client-side-rendering@0.4.9'
  - '@scalar/fastify-api-reference@1.73.0'
  - '@scalar/helpers@0.16.1'
  - '@scalar/json-magic@0.15.5'
  - '@scalar/json-schema-validator@0.1.10'
  - '@scalar/openapi-parser@0.29.11'
  - '@scalar/openapi-upgrader@0.4.2'
  - '@scalar/openapi-validator@0.1.10'
  - '@scalar/schemas@0.13.0'
  - '@scalar/types@0.23.0'
  - '@typescript-eslint/eslint-plugin@8.71.1'
  - '@typescript-eslint/parser@8.71.1'
  - '@typescript-eslint/project-service@8.71.1'
  - '@typescript-eslint/scope-manager@8.71.1'
  - '@typescript-eslint/tsconfig-utils@8.71.1'
  - '@typescript-eslint/type-utils@8.71.1'
  - '@typescript-eslint/types@8.71.1'
  - '@typescript-eslint/typescript-estree@8.71.1'
  - '@typescript-eslint/utils@8.71.1'
  - '@typescript-eslint/visitor-keys@8.71.1'
  - typescript-eslint@8.71.1

# Local fixes to dependencies (`pnpm patch <pkg>@<version>`, edit, `pnpm patch-commit <dir>`). Check each one when
# upgrading the package and drop it once upstream has the fix.
# - @astryxdesign/core: DateInput and DateTimeInput mount their calendar only while it is open (like DateTimeInput's
#   time list). Closed, it re-rendered a whole month grid with every keystroke of the form around it.
patchedDependencies:
  '@astryxdesign/core@0.6.7': patches/@astryxdesign__core@0.6.7.patch
